name: ethara_matchmaking
description: Ethara Event Matchmaking — client & guest mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  intl: ^0.20.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  shimmer: ^3.0.0
  collection: ^1.19.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  gal: ^2.3.1
  path_provider: ^2.1.5
  app_links: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
